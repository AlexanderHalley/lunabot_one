slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan  # Primary LiDAR scan
    mode: mapping

    # Multi-sensor configuration
    # We'll use LiDAR as primary, camera scan as secondary via laser_scan_merger
    
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.03  # Higher resolution for better camera integration
    max_laser_range: 12.0
    minimum_time_interval: 0.15  # Faster updates for multi-sensor
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Enhanced parameters for multi-sensor SLAM
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1  # More sensitive for indoor mapping
    minimum_travel_heading: 0.15
    scan_buffer_size: 15  # Larger buffer for multi-sensor data
    scan_buffer_maximum_scan_distance: 15.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 4.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 8           
    loop_match_maximum_variance_coarse: 2.5  
    loop_match_minimum_response_coarse: 0.3    
    loop_match_minimum_response_fine: 0.4

    # Correlation Parameters - Enhanced for camera integration
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.08

    # Loop Closure Parameters - Tighter for indoor environments
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.04
    loop_search_space_smear_deviation: 0.02

    # Scan Matcher Parameters - Balanced for multi-sensor
    distance_variance_penalty: 0.4
    angle_variance_penalty: 0.8

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.4
    use_response_expansion: true
# Hardware Controllers Configuration for ODrive S1 via CAN
# Uses odrive_ros2_control hardware interface

controller_manager:
  ros__parameters:
    update_rate: 100  # Controller update rate (Hz)
    
    # Controller list
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
      
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# Differential Drive Controller Configuration  
diff_drive_controller:
  ros__parameters:
    # Joint names (must match URDF)
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    # Physical robot parameters (match odrive_can_ids.yaml)
    wheel_separation: 0.6048
    wheel_radius: 0.165
    
    # Odometry parameters
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0  
    right_wheel_radius_multiplier: 1.0
    
    # Publishing
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    # Command timeout
    open_loop: false
    enable_odom_tf: true
    
    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        has_jerk_limits: false
        max_velocity: 2.0
        min_velocity: -2.0
        max_acceleration: 1.0
        min_acceleration: -1.0
        
    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        has_jerk_limits: false
        max_velocity: 2.0
        min_velocity: -2.0
        max_acceleration: 1.5
        min_acceleration: -1.5

# Joint State Broadcaster (publishes joint states for URDF visualization)
joint_state_broadcaster:
  ros__parameters:
    joints: 
      - left_wheel_joint
      - right_wheel_joint
    interfaces:
      - position
      - velocity
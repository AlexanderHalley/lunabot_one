twist_mux:
  ros__parameters:
    use_stamped: false
    
    # Topic configuration - note the proper YAML formatting
    topics:
      navigation:
        topic: "cmd_vel"
        timeout: 0.5
        priority: 10
      
      joystick:
        topic: "cmd_vel_joy"
        timeout: 0.1
        priority: 100
  
    
    # Safety parameters
    angular:
      z:
        max: 2.0
        min: -2.0
    
    linear:
      x:
        max: 2.0
        min: -2.0
      y:
        max: 0.0  # Assuming non-holonomic robot
        min: 0.0
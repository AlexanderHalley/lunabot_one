joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.15
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    enable_button: 5
    stamped: false
    axis_linear:
      x: 3
      y: 0
      z: 0
    axis_angular:
      pitch: 0
      roll: 0
      yaw: 2
    scale_linear:
      x: 1.0
      y: 0.0
      z: 0.0
    scale_angular:
      pitch: 0.0
      roll: 0.0
      yaw: 2.0
    scale_linear_turbo:
      x: 1.0
      y: 0.0
      z: 0.0
    scale_angular_turbo:
      pitch: 0.0
      roll: 0.0
      yaw: 2.0
    require_enable_button: true

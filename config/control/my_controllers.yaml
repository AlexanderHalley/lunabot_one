controller_manager:
  ros__parameters:
    update_rate: 20
    use_sim_time: true
    
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

# Controller-specific parameters
diff_drive_controller:
  ros__parameters:
    # For a 4-wheel robot, you typically want to control only the rear wheels
    # or use a different approach. Here are two options:
    
    # For lunabotics: Control all 4 wheels for maximum traction
    left_wheel_names:
      - "left_wheel_joint"
      - "left_front_wheel_joint"
    right_wheel_names:
      - "right_wheel_joint"
      - "right_front_wheel_joint"
    
    # Physical parameters (restored for proper turning)
    wheel_separation: 0.7620  # Distance between wheel centers - restored original width
    wheel_radius: 0.1778     # Radius of the wheels
    
    # Odometry calibration multipliers
    wheel_separation_multiplier: 1.1  # Restored to reasonable value after fixing Gazebo wheel_separation
    wheel_radius_multiplier: 1.0
    
    # Command and publishing settings
    cmd_vel_timeout: 0.1
    cmd_vel_topic: "~/cmd_vel"  # Default diff_drive_controller topic
    velocity_rolling_window_size: 10  # Increased for smoother motion
    publish_rate: 20.0
    
    # Odometry settings
    enable_odom_tf: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    
    # Covariance matrices (adjust based on your robot's accuracy)
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 99999.0, 99999.0, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 99999.0, 99999.0, 0.001]
    
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
        has_jerk_limits: false
    
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
        has_jerk_limits: false

joint_broad:
  ros__parameters:
    joints:
      - "left_wheel_joint"
      - "right_wheel_joint"  
      - "left_front_wheel_joint"
      - "right_front_wheel_joint"

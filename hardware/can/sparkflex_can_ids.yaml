# SparkFlex CAN ID Configuration
# Each SparkFlex motor controller has a unique CAN ID for communication
# This file maps physical wheel positions to CAN IDs

can_bus:
  interface: "can0"
  bitrate: 1000000  # 1 Mbps (SparkFlex supports up to 1 Mbps)

sparkflex_nodes:
  front_left:
    can_id: 1      # CAN ID 1 (SparkFlex uses decimal IDs)
    direction: 1   # 1 = forward, -1 = reverse
    motor_type: "NEO"  # Motor type for appropriate control

  front_right:
    can_id: 2      # CAN ID 2
    direction: -1  # Reverse for right side wheels
    motor_type: "NEO"

  rear_left:
    can_id: 3      # CAN ID 3
    direction: 1
    motor_type: "NEO"

  rear_right:
    can_id: 4      # CAN ID 4
    direction: -1  # Reverse for right side wheels
    motor_type: "NEO"

# Differential drive configuration
# Left side: front_left + rear_left
# Right side: front_right + rear_right
diff_drive:
  left_wheels: ["front_left", "rear_left"]
  right_wheels: ["front_right", "rear_right"]
  
  # Robot physical parameters (update with actual measurements)
  wheel_separation: 0.6048  # Distance between wheel centers (m) - for 70cm total width
  wheel_radius: 0.165      # Wheel radius (m)
  
  # Control parameters  
  max_velocity: 2.0        # Maximum linear velocity (m/s)
  max_angular_velocity: 2.0 # Maximum angular velocity (rad/s)